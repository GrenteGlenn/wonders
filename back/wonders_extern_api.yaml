openapi: 3.1.0
info:
  title: Wonders Backend Public API
  description: Wonders Backend Public API
  version: 1.0.0
servers:
  - url: 'http://localhost:3000'
    description: Development server
    auth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/user/{userId}:
    get:
      description: Get an User
      parameters:
        - in: path
          name: userId
          description: The User Id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User Found
          content:
            application/json:
              schema:
                $ref: '#/definitions/User_Definition'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Forbidden'
    put:
      description: Edit an User
      parameters:
        - in: path
          name: userId
          description: The User Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/definitions/User_Definition'
      responses:
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Forbidden'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        201:
          description: Edited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User edited'
    delete:
      description: Delete an User
      parameters:
        - in: path
          name: userId
          description: The User Id
          required: true
          schema:
            type: string
      responses:
        403:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Unauthorized'
        404:
          description: User Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User not found'
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User deleted'

  /api/user/{userId}/a:
    get:
      description: Get all addresses for a user
      parameters:
        - in: path
          name: userId
          description: The User Id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    $ref: '#/definitions/Address_Array_Definition'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ' No addresses found'
    post:
      description: Create a new Address for a user
      parameters:
        - in: path
          name: userId
          description: The User Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/definitions/Address_Definition'
      responses:
        200:
          description: Address Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Address created'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Forbidden'
  /api/address/{addressId}:
    get:
      description: Get an user's address
      parameters:
        - in: path
          name: addressId
          description: The Address Id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: '#/definitions/Address_Definition'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Address not found'
    put:
      description: Edit an user's address
      parameters:
        - in: path
          name: addressId
          description: The Address Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/definitions/Address_Definition'
      responses:
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Forbidden'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Address not found'
        201:
          description: Edited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Address edited'
    delete:
      description: Delete an user's address
      parameters:
        - in: path
          name: addressId
          description: The Address Id
          required: true
          schema:
            type: string
      responses:
        403:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Unauthorized'
        404:
          description: Address Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Address not found'
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Address deleted'
  /api/auth/register:
    post:
      description: Register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'John'
                surname:
                  type: string
                  example: 'Doe'
                birthDate:
                  type: string
                  example: '1990-01-01'
                country:
                  type: string
                  example: 'France'
                email:
                  type: string
                  example: 'john.doe@nimp.tkt'
                password:
                  type: string
                  example: 'password'

      responses:
        201:
          description: New response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User created'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Bad Request'
  /api/auth/login:
    post:
      description: Login to the API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'john.doe@nimp.tkt'
                password:
                  type: string
                  example: 'password'
      responses:
        401:
          description: Bad UserName or Password
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                    example: 'Bad Email or Password'
        200:
          description: Login successful
          headers:
            Authorization:
              description: JWT token
              schema:
                type: JWT
              example: 'Bearer eyJhbGciOi'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 'eyJhbGciOi'
  /api/quiz/{quizId}/a/{questionId}:
    post:
      description: Answer a quiz's question
      parameters:
        - in: path
          name: quizId
          description: The Quiz Id
          required: true
          schema:
            type: string
        - in: path
          name: questionId
          description: The Question Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  $ref: '#/definitions/Answer'
      responses:
        201:
          description: Answer Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'Answer Accepted'
  /api/quiz/{quizId}:
    get:
      description: Get a question pool for a quiz
      parameters:
        - in: path
          name: quizId
          description: The Quiz Id
          required: true
          schema:
            type: string
      responses:
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Quiz not found' }
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  quiz:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId:
                          type: string
                          example: 'uuid'
                        required:
                          type: boolean
  /coffee:
    get:
      description: What ? Tea ? Who said Tea ? Do you have Tea ? Tea ? For me ? Me Tea ! All the Tea ! Tea Time is a Me Time !
      responses:
        418:
          description: I'm a TeaPot
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "I'm a Teapot"

definitions:
  Address_Definition:
    type: object
    properties:
      addressId:
        type: string
        example: 'uuid'
      name:
        type: string
        example: 'Home'
      street:
        type: string
        example: '1 rue de la Paix'
      city:
        type: string
        example: 'Paris'
      zipCode:
        type: string
        example: '75000'
      complement:
        type:
          - string
          - null
        example: 'Apartment 1'
      country:
        type: string
        example: 'France'
  Answer:
    oneOf:
      - type: string
      - type: integer
      - type: boolean
      - type: array
        items:
          type: integer
  Address_Array_Definition:
    type: array
    items:
      $ref: '#/definitions/Address_Definition'
  User_Definition:
    type: object
    properties:
      userId:
        type: string
        example: 'uuid'
      name:
        type: string
        example: 'John'
      surname:
        type: string
        example: 'Doe'
      birthDate:
        type: string
        example: '1990-01-01'
      country:
        type: string
        example: 'France'
      email:
        type: string
        example: 'john.doe@nimp.tkt'
