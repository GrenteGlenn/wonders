openapi: 3.1.0
info:
  title: Wonders Backend Public API
  description: Wonders Backend Public API
  version: 1.0.0
servers:
  - url: 'http://localhost:3000'
    description: Development server
    auth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/quiz/{quizId}/a/{questionId}:
    post:
      description: Answer a quiz's question
      parameters:
        - in: path
          name: quizId
          description: The Quiz Id
          required: true
          schema:
            type: string
        - in: path
          name: questionId
          description: The Question Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  $ref: '#/definitions/Answer'
      responses:
        201:
          description: Answer Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'Answer Accepted'
  /api/quiz/{quizId}:
    get:
      description: Get a question pool for a quiz
      parameters:
        - in: path
          name: quizId
          description: The Quiz Id
          required: true
          schema:
            type: string
      responses:
        404:
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Quiz not found' }
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  quiz:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId:
                          type: string
                          example: 'uuid'
                        required:
                          type: boolean
definitions:
  Answer:
    oneOf:
      - type: string
      - type: integer
      - type: boolean
      - type: array
        items:
          type: integer
