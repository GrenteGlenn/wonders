openapi: 3.1.0
info:
  title: Wonders Backend Public API
  description: Wonders Backend Public API
  version: 1.0.0
servers:
  - url: 'http://localhost:3000'
    description: Development server
    auth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/auth/login:
    post:
      description: Register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'john.doe@nimp.tkt'
                password:
                  type: string
                  example: 'password'
      responses:
        200:
          description: Login successful
          headers:
            Authorization:
              description: JWT token
              schema:
                type: JWT
              example: 'Bearer eyJhbGciOi'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      userId:
                        type: number
                        example: 1
                      email:
                        type: string
                        example: 'exemple@gmail.com'
                      token:
                        type: string
                        example: 'eyJhbGciOi'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Error! Something went wrong.'
  /api/auth/register:
    post:
      description: Login to the API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: 'John'
                last_name:
                  type: string
                  example: 'Doe'
                birthDate:
                  type: string
                  example: '2024-07-19T00:22:05.916Z'
                country:
                  type: string
                  example: 'France'
                email:
                  type: string
                  example: 'john.doe@nimp.tkt'
                password:
                  type: string
                  example: 'password'
                language_id:
                  type: integer
                  example: 1

      responses:
        401:
          description: Bad UserName or Password
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                    example: 'Error! Something went wrong.'
        403:
          description: Email already use
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                    example: 'client already registered'
        201:
          description: New response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'client created successfully.'
