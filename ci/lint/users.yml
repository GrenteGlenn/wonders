lint_back_users:
  stage: lint
  image: node:22
  before_script:
    - cd back/users_wonders
    - npm install
  script:
    - npm run lint
  tags:
    - PLI
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  cache:
    policy: pull-push
    unprotect: false
    untracked: false
    when: on_success
    paths:
      - "back/users_wonders/node_modules"