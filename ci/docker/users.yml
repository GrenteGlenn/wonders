docker_back_users:
  stage: docker
  image: docker
  services:
    - name: docker-dind
      command: ["--tls=false"]
  needs: ["build_back_users"]
  script:
    - echo "registry $CI_REGISTRY CI_REGISTRY_USER $CI_REGISTRY_USER CI_REGISTRY_PASSWORD $CI_REGISTRY_PASSWORD"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f back/users_wonders/deploy/dockerfile -t back_users_$CI_COMMIT_REF_NAME .
    - docker push back_users_$CI_COMMIT_REF_NAME
    - echo "Docker image for back_users_$CI_COMMIT_REF_NAME built and pushed successfully."  
  tags:
    - PLI
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'