build_front_web:
  stage: build
  image: node:22
  before_script:
    - cd front/wonders-web/
    - npm install
  script:
    - npm run build
  tags:
    - PLI
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  cache:
    policy: pull-push
    unprotect: false
    untracked: false
    when: on_success
    paths:
      - "front/wonders-web/node_modules"