include:
#  - local: 'ci/rules/block-unallowed-branches.yml'

  # Lint jobs
  - local: 'ci/lint/users.yml'
  - local: 'ci/lint/quizz.yml'
  - local: 'ci/lint/countries.yml'
  - local: 'ci/lint/activities.yml'

  # Test jobs
  - local: 'ci/test/users.yml'
  - local: 'ci/test/countries.yml'
  - local: 'ci/test/quizz.yml'
  - local: 'ci/test/activities.yml'

  # Build jobs
  - local: 'ci/build/users.yml'
  - local: 'ci/build/countries.yml'
  - local: 'ci/build/quizz.yml'
  - local: 'ci/build/activities.yml'
  - local: 'ci/build/front.yml'

  # Docker jobs
  # - local: 'ci/docker/users.yml'
  # - local: 'ci/docker/countries.yml'
  # - local: 'ci/docker/activities.yml'

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

stages:
  - rule
  - lint
  - test
  - build
  # - docker

