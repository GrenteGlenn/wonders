workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

stages:
  - lint

variables:
  NODE_ENV: dev

job1:
  stage: .pre
  script:
    - echo "This job runs in merge request pipelines"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'


# Manque fly, activities
lint_back_user:
  stage: lint
  image: node:22
  script:
    - cd back/users_wonders
    - npm install
    #- npm run lint
  tags:
    - PLI
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

