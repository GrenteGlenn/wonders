stages:
  - lint

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  NODE_ENV: dev

# Manque fly, activities
lint_back_user:
  stage: lint
  image: node:22
  before_script:
    - cd back/users_wonders
    - npm install
  script:
    - npm run lint
  tags:
    - PLI
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
  cache:
    policy: pull-push
    unprotect: false
    untracked: false
    when: on_success
    paths:
      - "back/users_wonders/node_modules"

