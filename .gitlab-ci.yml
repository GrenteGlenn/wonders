stages:
  - rule
  - lint
#  - test

block-unallowed-branches:
  stage: rule
  image: alpine
  script:
    - |
      echo "Merge refusé : seule 'back_dev' ou 'dev_web' peuvent être mergées dans 'main'"
      exit 1
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "back_dev" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "dev_web"'
      when: always
    - when: never


workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  NODE_ENV: dev


lint_back_user:
  stage: lint
  image: node:22
  before_script:
    - cd back/users_wonders
    - npm install
  script:
    - npm run lint
  tags:
    - PLI
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
  cache:
    policy: pull-push
    unprotect: false
    untracked: false
    when: on_success
    paths:
      - "back/users_wonders/node_modules"

