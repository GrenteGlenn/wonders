stages:
  - lint
  - pre

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'


workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  NODE_ENV: dev

job1:
  stage: pre
  tags:
    - PLI
  script:
    - echo "This job runs in merge request pipelines"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"


# Manque fly, activities
lint_back_user:
  stage: lint
  image: node:22
  before_script:
    - cd back/users_wonders
    - npm install
  script:
    - npm run lint
  tags:
    - PLI
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
  cache:
    policy: pull-push
    unprotect: false
    untracked: false
    when: on_success
    paths:
      - "back/users_wonders/node_modules"

