<div class="bg-white rounded-lg shadow-md p-4 w-80 mt-24 sticky top-10">
  <h2 class="text-lg font-bold mb-4">Résumé</h2>

  <!-- Étape 1 : Destination -->
  <ng-container *ngIf="currentStep >= 1">
    <div class="flex items-center gap-2 mb-2">
      <lucide-icon
        [name]="selectedDestination ? 'check' : 'circleX'"
        [ngClass]="selectedDestination ? 'text-green-500' : 'text-red-500'"
        class="w-4 h-4"
      ></lucide-icon>
      <span>
        Destination :
        <ng-container *ngIf="selectedDestination; else noDest">
          {{ selectedDestination.name }}
        </ng-container>
        <ng-template #noDest>Non sélectionnée</ng-template>
      </span>
    </div>
  </ng-container>

  <!-- Étape 2 : Activité (seulement si currentStep >= 2) -->
  <ng-container *ngIf="currentStep >= 2">
    <div class="flex items-center gap-2 mb-2">
      <lucide-icon
        [name]="selectedActivity?.category.name ? 'check' : 'circleX'"
        [ngClass]="selectedActivity?.category.name ? 'text-green-500' : 'text-red-500'"
        class="w-4 h-4"
      ></lucide-icon>
      <span>
        Catégorie :
        <ng-container *ngIf="selectedActivity?.category; else noCat">
          {{ selectedActivity.category.name }}
        </ng-container>
        <ng-template #noCat>Non sélectionnée</ng-template>
      </span>
    </div>

    <div class="flex items-center gap-2 mb-2">
      <lucide-icon
        [name]="selectedActivity?.name ? 'check' : 'circleX'"
        [ngClass]="selectedActivity?.name ? 'text-green-500' : 'text-red-500'"
        class="w-4 h-4"
      ></lucide-icon>
      <span>
        Ville :
        <ng-container *ngIf="selectedActivity?.name; else noCity">
          {{ selectedActivity.name }}
          
        </ng-container>
        <ng-template #noCity>Non sélectionnée</ng-template>
      </span>
    </div>
  </ng-container>

  <!-- Étape 3 : Vol (currentStep >= 3) -->
  <ng-container *ngIf="currentStep >= 3">
    <div class="flex items-center gap-2 mb-2">
      <lucide-icon
        [name]="selectedFlight ? 'check' : 'circleX'"
        [ngClass]="selectedFlight ? 'text-green-500' : 'text-red-500'"
        class="w-4 h-4"
      ></lucide-icon>
      <span>
        Vol :
        <ng-container *ngIf="selectedFlight; else noFlight">{{ selectedFlight.vol }}</ng-container>
        <ng-template #noFlight>Non sélectionné</ng-template>
      </span>
    </div>

    <!-- Détails -->
    <!-- <div *ngIf="selectedFlight" class="pl-5 mt-2 text-sm text-gray-600 space-y-1">
      <p><strong>Compagnie :</strong> {{ selectedFlight.airline }}</p>
      <p>
        <strong>Départ :</strong> {{ selectedFlight.departure }} à
        {{ selectedFlight.departureTime | date: 'shortTime' }}
      </p>
      <p>
        <strong>Arrivée :</strong> {{ selectedFlight.arrival }} à
        {{ selectedFlight.arrivalTime | date: 'shortTime' }}
      </p>
      <p><strong>Durée :</strong> {{ selectedFlight.duration.replace('PT', '').toLowerCase() }}</p>
      <p><strong>Prix :</strong> {{ selectedFlight.price }} {{ selectedFlight.currency }}</p>
    </div> -->
  </ng-container>

  <!-- Étape 4 : Hôtel (currentStep >= 4) -->
  <ng-container *ngIf="currentStep >= 4">
    <div class="flex items-center gap-2 mb-2">
      <lucide-icon
        [name]="selectedHotel?.name ? 'check' : 'circleX'"
        [ngClass]="selectedHotel?.name ? 'text-green-500' : 'text-red-500'"
        class="w-4 h-4"
      ></lucide-icon>
      <span>
        Hôtel :
        <ng-container *ngIf="selectedHotel?.name; else noHotel">
          {{ selectedHotel.name }}
        </ng-container>
        <ng-template #noHotel>Non sélectionné</ng-template>
      </span>
    </div>

    <!-- <div *ngIf="selectedHotel?.name" class="pl-5 mt-2 text-sm text-gray-600 space-y-1">
      <p *ngIf="selectedHotel?.country"><strong>Pays :</strong> {{ selectedHotel.country }}</p>
      <p *ngIf="selectedHotel?.distance?.value">
        <strong>Distance :</strong> {{ selectedHotel.distance.value }} {{ selectedHotel.distance.unit }}
      </p>
      <p>
        <strong>Offres :</strong>
        {{ selectedHotel.hasOffers ? 'Oui' : 'Aucune offre disponible' }}
      </p>
    </div> -->
  </ng-container>
</div>
