<div class="w-8/12 mx-auto py-10">
  <div class="text-sm text-gray-500 mb-4"><span>San Francisco</span> / <span>New York</span></div>

  <h2 class="text-xl font-semibold mb-4">Select your departure and return flights</h2>

  <div class="space-y-3 mb-6">
    <div class="flex items-center justify-between bg-gray-100 p-3 rounded-lg">
      <div class="flex items-center">
        <svg
          class="w-6 h-6 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span>SFO → JFK</span>
      </div>
      <button class="bg-white text-blue-500 px-4 py-1 rounded-md text-sm">Select</button>
    </div>
    <div class="flex items-center justify-between bg-gray-100 p-3 rounded-lg">
      <div class="flex items-center">
        <svg
          class="w-6 h-6 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span>SFO → LAS</span>
      </div>
      <button class="bg-white text-blue-500 px-4 py-1 rounded-md text-sm">Select</button>
    </div>
  </div>

  <h2 class="text-xl font-semibold mb-4">Passenger information</h2>

  <form class="space-y-4">
    <div>
      <label for="firstName" class="block text-sm font-medium text-gray-700">First name</label>
      <input
        type="text"
        id="firstName"
        name="firstName"
        class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div>
      <label for="lastName" class="block text-sm font-medium text-gray-700">Last name</label>
      <input
        type="text"
        id="lastName"
        name="lastName"
        class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div>
      <label for="dob" class="block text-sm font-medium text-gray-700">Date of birth</label>
      <input
        type="text"
        id="dob"
        name="dob"
        placeholder="MM/DD/YYYY"
        class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <h2 class="text-xl font-semibold mt-6 mb-4">Contact information</h2>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div>
      <label for="phone" class="block text-sm font-medium text-gray-700">Phone number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div class="flex items-center justify-between">
      <span class="text-sm text-gray-500">SMS messages for important information and reminders</span>
      <label class="switch">
        <input type="checkbox" />
        <span class="slider round"></span>
      </label>
    </div>

    <button
      type="submit"
      class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      Continue
    </button>
  </form>
</div>
