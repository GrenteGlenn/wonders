<div class="w-8/12 mx-auto py-10" *ngIf="!showResults && questions.length > 0">
  <span>Question {{currentQuestionIndex + 1}}/{{questions.length}}</span>
  <div class="progressBar">
    <mat-progress-bar
      class="custom-progress-bar"
      mode="determinate"
      [color]="'primary'"
      [value]="percent"
      style="margin-top: 1em;">
    </mat-progress-bar>
  </div>

  <span class="flex w-full py-10 items-center justify-center text-md !important">
    {{questions[currentQuestionIndex].questionData.question}}
  </span>

  <div *ngFor="let answer of questions[currentQuestionIndex].answers; let i = index"
     class="w-full flex py-4 px-6 rounded-md border mt-5">
    <input [id]="'radio-' + i"
          type="radio"
          [value]="answer.answer"
          name="question-option"
          [(ngModel)]="selectedAnswers[currentQuestionIndex]"
          (ngModelChange)="onAnswerSelected(answer.answer, questions[currentQuestionIndex])"
          class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
    <label [for]="'radio-' + i" class="ms-2 text-sm font-medium text-gray-900">
      {{answer.answer}}
    </label>
  </div>

  <button *ngIf="currentQuestionIndex > 0"
          class="bg-slate-300 rounded-md py-2 px-5 float-start mt-10"
          (click)="previousQuestion()">
    Précédent
  </button>

  <button *ngIf="currentQuestionIndex < questions.length - 1"
          [disabled]="!selectedAnswers[currentQuestionIndex]"
          [ngClass]="{'bg-blue-500 text-white': selectedAnswers[currentQuestionIndex], 'bg-gray-300 text-gray-500': !selectedAnswers[currentQuestionIndex]}"
          class="rounded-md py-2 px-5 float-end mt-10"
          (click)="nextQuestion()">
    Next
  </button>

  <button *ngIf="currentQuestionIndex === questions.length - 1"
          [disabled]="!selectedAnswers[currentQuestionIndex]"
          [ngClass]="{'bg-green-500 text-white': selectedAnswers[currentQuestionIndex], 'bg-gray-300 text-gray-500': !selectedAnswers[currentQuestionIndex]}"
          class="rounded-md py-2 px-5 float-end mt-10"
          (click)="showResult()">
    Terminer
  </button>
</div>


<div *ngIf="showResults" class="w-8/12 mx-auto py-10">
  <h1 class="text-3xl font-bold text-center mb-10">Félicitations ! Vous avez terminé le questionnaire</h1>
  <h2 class="text-sm text-center mb-10">Voici les 3 destinations proposées d'après le questionnaire</h2>
  <h2 class="text-sm text-center mb-10">Veuillez en selectionner une</h2>
  <div *ngIf="isProposalLoading" class="flex justify-center">
    <img src="assets/loading.gif" alt="loading proposal">
  </div>
  <div *ngIf="!isProposalLoading" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let suggestion of proposalCountries" class="bg-white shadow-lg rounded-lg  cardTransition hover:cursor-pointer" 
    (click)="onSelectProposal(suggestion)">
      <img src={{suggestion.img_full}} alt="picture of one country" width="100%" height="100%" class="myImg">
      <h2 class="text-xl font-semibold  text-center text-black">{{suggestion.pays}}</h2>
    </div>
  </div>
</div>
