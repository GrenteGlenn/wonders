<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8" *ngIf="!showResults && questions.length > 0">
  <!-- Image décorative -->
  <img
    [src]="'assets/images/hero-home-' + (currentQuestionIndex + 1) + '.jpg'"
    alt="Illustration décorative"
    class="decorative-image"
  />

  <!-- Progression -->
  <div class="flex justify-between items-center text-sm text-gray-500">
    <span>Question {{ currentQuestionIndex + 1 }}/{{ questions.length }}</span>
    <span>{{ percent | number:'1.0-0' }}%</span>
  </div>

  <mat-progress-bar
    class="mt-2 mb-8 rounded-full h-2 custom-progress-bar"
    mode="determinate"
    [color]="'primary'"
    [value]="percent"
  ></mat-progress-bar>

  <!-- Question -->
  <h2 class="text-xl font-semibold text-center mb-6">
    {{ questions[currentQuestionIndex].questionData.question }}
  </h2>

  <!-- Réponses -->
  <div
    *ngFor="let answer of questions[currentQuestionIndex].answers; let i = index"
    class="flex items-center gap-3 p-4 mb-4 border rounded-lg shadow-sm hover:bg-blue-50 transition cursor-pointer"
    [class.border-blue-500]="selectedAnswers[currentQuestionIndex] === answer.answer"
    [class.bg-blue-100]="selectedAnswers[currentQuestionIndex] === answer.answer"
    (click)="onAnswerSelected(answer.answer, questions[currentQuestionIndex])"
  >
    <input
      [id]="'radio-' + i"
      type="radio"
      [value]="answer.answer"
      name="question-option"
      [(ngModel)]="selectedAnswers[currentQuestionIndex]"
      class="w-5 h-5 text-blue-600"
    />
    <label [for]="'radio-' + i" class="text-sm text-gray-800">{{ answer.answer }}</label>
  </div>

  <!-- Boutons navigation -->
  <div class="flex justify-between mt-10">
    <button
      *ngIf="currentQuestionIndex > 0"
      class="px-5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-md"
      (click)="previousQuestion()"
    >
      Précédent
    </button>

    <button
      *ngIf="currentQuestionIndex < questions.length - 1"
      [disabled]="!selectedAnswers[currentQuestionIndex]"
      [ngClass]="{
        'bg-blue-500 text-white hover:bg-blue-600': selectedAnswers[currentQuestionIndex],
        'bg-gray-300 text-gray-500': !selectedAnswers[currentQuestionIndex]
      }"
      class="px-5 py-2 rounded-md ml-auto"
      (click)="nextQuestion()"
    >
      Suivant
    </button>

    <button
      *ngIf="currentQuestionIndex === questions.length - 1"
      [disabled]="!selectedAnswers[currentQuestionIndex]"
      [ngClass]="{
        'bg-green-500 text-white hover:bg-green-600': selectedAnswers[currentQuestionIndex],
        'bg-gray-300 text-gray-500': !selectedAnswers[currentQuestionIndex]
      }"
      class="px-5 py-2 rounded-md ml-auto"
      (click)="showResult()"
    >
      Terminer
    </button>
  </div>
</div>

<!-- Résultats -->
<div *ngIf="showResults" class="max-w-4xl mx-auto py-12 px-4">
  <h1 class="text-3xl font-bold text-center mb-6">🎉 Félicitations !</h1>
  <p class="text-center text-gray-600 mb-6">Voici les 3 destinations proposées selon vos réponses</p>
  <p class="text-center text-sm text-gray-500 mb-10">Cliquez pour en sélectionner une</p>

  <div *ngIf="isProposalLoading" class="flex justify-center">
    <img src="assets/loading.gif" alt="Chargement des destinations" />
  </div>

  <div *ngIf="!isProposalLoading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <div
      *ngFor="let suggestion of proposalCountries"
      class="bg-white border rounded-xl shadow hover:shadow-lg overflow-hidden cursor-pointer transition transform hover:scale-[1.02]"
      (click)="onSelectProposal(suggestion)"
    >
      <img
        [src]="suggestion.img_full"
        alt="image destination"
        class="w-full h-40 object-cover"
      />
      <h2 class="text-lg font-medium text-center text-gray-800 py-4">
        {{ suggestion.pays }}
      </h2>
    </div>
  </div>
</div>
