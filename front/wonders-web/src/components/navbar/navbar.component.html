<!-- Navigation principale -->
<nav class="flex items-center justify-between px-4 md:px-10 py-2 bg-white shadow-md">
  <!-- Logo -->
  <div class="flex items-center space-x-4 cursor-pointer" (click)="goHomePage()">
    <img src="assets/images/logo.png" alt="Logo" class="h-10" />
  </div>

  <!-- Navigation desktop -->
  <div class="hidden md:flex items-center space-x-6">
    <!-- Bouton Planifier un voyage (desktop uniquement) -->
    <div *ngIf="isAuthenticated" class="card bg-600 h-full px-3 py-2 rounded-md bg-[#FFA500]">
      <button (click)="goChoiceGuide()" class="text-black flex w-full">
        <lucide-icon name="route" class="mr-1"> </lucide-icon>
        {{ 'NavBar.ButtonTrip' | translate }}
      </button>
    </div>

    <!-- Sélecteur de langue -->
    <select
      [value]="translateService.currentLang"
      (change)="onLanguageChange($event)"
      class="p-2 border rounded text-sm"
    >
      <option value="fr">{{ 'NavBar.TranslateFR' | translate }}</option>
      <option value="en">{{ 'NavBar.TranslateEN' | translate }}</option>
    </select>

    <!-- Connexion / Profil -->
    <div *ngIf="!isAuthenticated">
      <button class="text-black flex items-center" (click)="login()">
        <lucide-icon name="users"></lucide-icon>
      </button>
    </div>

    <div *ngIf="isAuthenticated" class="relative">
      <img
        src="https://github.com/shadcn.png"
        alt="User Avatar"
        class="h-8 w-8 rounded-full cursor-pointer"
        (click)="toggleMenu()"
      />
      <div *ngIf="isMenuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50">
        <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer" (click)="goProfile()">
          {{ 'NavBar.ButtonProfile' | translate }}
        </a>
         <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer" (click)="goForum()">
          Forum
        </a>
        <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer" (click)="goChat()">
          {{ 'NavBar.Chat' | translate }}
        </a>
        <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer" (click)="disconnect()">
          {{ 'NavBar.ButtonDeconnexion' | translate }}
        </a>
      </div>
    </div>
  </div>

  <!-- Burger menu mobile -->
  <div class="md:hidden relative">
    <button
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu"
      class="focus:outline-none p-2 rounded-md hover:bg-gray-200"
    >
      <svg
        *ngIf="!isMobileMenuOpen"
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <svg
        *ngIf="isMobileMenuOpen"
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div *ngIf="isMobileMenuOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-2 z-50">
      <!-- Planifier un voyage (optionnel sur mobile) -->
      <div *ngIf="isAuthenticated" class="px-4 py-2 border-b">
        <button
          (click)="goChoiceGuide()"
          class="w-full text-left flex items-center gap-2 text-gray-700 hover:bg-gray-100"
        >
          <lucide-icon name="route"></lucide-icon>
          {{ 'NavBar.ButtonTrip' | translate }}
        </button>
      </div>

      <!-- Choix de la langue -->
      <div class="px-4 py-2 border-b">
        <select
          [value]="translateService.currentLang"
          (change)="onLanguageChange($event)"
          class="w-full p-2 border rounded text-sm"
        >
          <option value="fr">{{ 'NavBar.TranslateFR' | translate }}</option>
          <option value="en">{{ 'NavBar.TranslateEN' | translate }}</option>
        </select>
      </div>

      <!-- Connexion / Déconnexion -->
      <div class="px-4 py-2">
        <button *ngIf="!isAuthenticated" (click)="login()" class="w-full text-left text-gray-700 hover:bg-gray-100">
          <lucide-icon name="users"></lucide-icon>
        </button>
        <div *ngIf="isAuthenticated" class="flex flex-col">
          <button (click)="goProfile()" class="w-full text-left text-gray-700 hover:bg-gray-100 py-1">
            {{ 'NavBar.ButtonProfile' | translate }}
          </button>
          <button
            (click)="goToSafe()"
            class="w-full text-left text-gray-700 hover:bg-gray-100 py-1"
            routerLink="/"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            <lucide-icon name="lock" class="w-5 h-5"></lucide-icon>
            <span>Personal Safe</span>
          </button>
          <button (click)="disconnect()" class="w-full text-left text-gray-700 hover:bg-gray-100 py-1">
            {{ 'NavBar.ButtonDeconnexion' | translate }}
          </button>
        </div>
        <button
          (click)="goProfile()"
          *ngIf="isAuthenticated"
          class="px-4 py-2 w-full text-sm text-gray-700 hover:bg-gray-100 flex items-center"
        >
          <lucide-icon name="user-round" class="mr-3 h-5 w-5"></lucide-icon>
          {{ 'NavBar.ButtonProfile' | translate }}
        </button>

        <button (click)="goForum()" class="px-4 py-2 text-sm w-full text-gray-700 hover:bg-gray-100 flex items-center">
          <lucide-icon name="message-square-text" class="mr-3 h-5 w-5"></lucide-icon>
          Forum
        </button>
        <button (click)="goChat()" class="px-4 py-2 text-sm w-full text-gray-700 hover:bg-gray-100 flex items-center">
          <lucide-icon name="message-square-text" class="mr-3 h-5 w-5"></lucide-icon>
          Chat
        </button>
        <!-- A rajouter quand la fonctionnalitée sera disponible
              <a href="#" class=" px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                <lucide-icon name="users" class="mr-3 h-5 w-5"></lucide-icon>
                Communities
              </a>
              -->
        <!-- A rajouter quand la fonctionnalitée sera disponible
              <a href="#" class=" px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                <lucide-icon name="message-circle" class="mr-3 h-5 w-5"></lucide-icon>
                Chat
              </a>
              -->
        <!-- A rajouter quand la fonctionnalitée sera disponible
              <a href="#" class=" px-4 py-2 text-sm text-red-700 hover:bg-gray-100 flex items-center">
                <lucide-icon name="shield" class="mr-3 h-5 w-5"></lucide-icon>
                Panel administrator
              </a>
              -->
        <div class="border-t my-1"></div>
        <!-- A rajouter quand la fonctionnalitée sera disponible
              <a href="#" class=" px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                <lucide-icon name="plane" class="mr-3 h-5 w-5"></lucide-icon>
                Flights
              </a>
              -->
        <!-- A rajouter quand la fonctionnalitée sera disponible
              <a href="#" class=" px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                <lucide-icon name="bed" class="mr-3 h-5 w-5"></lucide-icon>
                Hotels
              </a>
              -->
        <!-- <a href="activities" class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
          <lucide-icon name="tree-palm" class="mr-3 h-5 w-5"></lucide-icon>
          Activités
        </a> -->
        <a
          class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center cursor-pointer"
          (click)="isAuthenticated ? disconnect() : login()"
        >
          <lucide-icon name="power" class="mr-3 h-5 w-5"></lucide-icon>

          {{ isAuthenticated ? ('NavBar.ButtonDeconnexion' | translate) : ('NavBar.ButtonConnexion' | translate) }}
        </a>
      </div>
    </div>
  </div>
</nav>
