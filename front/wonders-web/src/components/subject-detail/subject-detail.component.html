<div class="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-full">
    <div *ngIf="subject" class="bg-white rounded-xl shadow-md p-8 mb-8">
      <div class="justify-between flex">
        <span class="text-lg font-bold text-gray-900 mb-4">{{ subject.title }}</span>
        <p class="text-gray-500 text-sm mb-2">Créé le {{ subject.created_at | date: 'longDate' }}</p>
      </div>
      <p class="text-gray-700 text-lg">{{ subject.content }}</p>
    </div>

    <!-- Liste des commentaires -->
    <div *ngFor="let comment of paginatedComments" class="flex bg-white rounded-xl shadow-md mb-6 relative">
      <!-- Avatar -->
      <div class="w-1/4 border-r border-gray-200 flex flex-col items-center py-6 space-y-3">
        <img src="https://github.com/shadcn.png" class="rounded-full w-20 h-20" alt="Avatar" />
        <p class="text-gray-900 font-semibold"> {{ comment.user?.first_name || 'Utilisateur inconnu' }}
        </p>
        <div class="text-gray-500 text-sm">Posts: 13</div>
        <div class="text-gray-500 text-sm">Likes: 2346</div>
      </div>

      <!-- Message -->
      <div class="flex-1 flex flex-col justify-between p-6 relative">
        <div>
          <div class="flex justify-between items-center">
            <p class="text-gray-400 text-sm">Posté le {{ comment.created_at | date: 'longDate' }}</p>
            <p class="text-gray-400 text-sm">#{{ comment.id }}</p>
          </div>
          <p class="text-gray-700 mt-4">
            {{ comment.message }}
          </p>
        </div>

        <!-- Actions -->
        <div class="flex justify-between items-center mt-6">
          <!-- Système de vote -->
          <div class="flex items-center gap-4">
            <button class="flex items-center text-gray-500 hover:text-blue-600">
              <lucide-icon name="thumbs-up" class="w-5 h-5 mr-1"></lucide-icon>
              <span>1</span>
            </button>
            <button class="flex items-center text-gray-500 hover:text-red-600">
              <lucide-icon name="thumbs-down" class="w-5 h-5 mr-1"></lucide-icon>
              <span>0</span>
            </button>
          </div>

          <!-- Actions delete -->
          <div class="flex items-center space-x-4 text-gray-400 text-sm">
            <button class="hover:underline">Citer</button>
            <button
              *ngIf="comment.user_id === user_id"
              (click)="deleteComment(comment, subject)"
              class="text-gray-400 flex hover:text-red-600"
              title="Supprimer"
            >
              <lucide-icon name="x" class="w-4 h-6"></lucide-icon>
              <span class="mt-0.5">supprimer</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- pagination -->
    <div *ngIf="totalCommentPages > 1" class="mt-4 flex justify-center gap-2">
      <button
        (click)="changePage(currentPage - 1)"
        [disabled]="currentPage === 1"
        class="px-3 py-1 border rounded disabled:opacity-50"
      >
        Précédent
      </button>

      <ng-container *ngFor="let page of [].constructor(totalCommentPages); let i = index">
        <button
          (click)="changePage(i + 1)"
          [class.bg-blue-600]="currentPage === i + 1"
          [class.text-white]="currentPage === i + 1"
          class="px-3 py-1 border rounded hover:bg-blue-100"
        >
          {{ i + 1 }}
        </button>
      </ng-container>

      <button
        (click)="changePage(currentPage + 1)"
        [disabled]="currentPage === totalCommentPages"
        class="px-3 py-1 border rounded disabled:opacity-50"
      >
        Suivant
      </button>
    </div>

    <!-- Ajout d'un commentaire -->
    <div class="bg-white rounded-xl shadow-md p-8 mt-8">
      <h2 class="text-2xl font-bold mb-4">Répondre</h2>
      <textarea
        [(ngModel)]="newComment.message"
        rows="4"
        placeholder="Écrire votre réponse..."
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
      ></textarea>
      <div class="flex justify-end mt-4">
        <button
          (click)="createComment(subject?.id)"
          [disabled]="!newComment.message"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg"
        >
          Envoyer
        </button>
      </div>
    </div>
  </div>
</div>
