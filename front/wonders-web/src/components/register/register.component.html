<div class="relative flex justify-center items-center min-h-screen bg-cover bg-center" style="background-image: url('assets/images/hero-home-3.jpg');">
  <!-- filtre sombre pour lisibilité -->
  <div class="absolute inset-0 bg-black bg-opacity-30"></div>

  <!-- fenêtre d'inscription avec effet glassmorphism -->
  <div class="relative z-10 glass-card grid grid-cols-1 justify-items-center max-w-2xl w-full mx-4 my-10">
    <h1 class="text-2xl font-medium mb-6 text-white">S'enregistrer</h1>
    <p class="justify-self-end text-red-300 px-10 text-sm w-full text-right">Champs requis *</p>
    <div class="justify-self-start px-6 w-full">
      <div class="mb-4">
        <label for="lb_email" class="text-white">Adresse mail <i class="text-red-300">*</i></label><br />
        <input type="text" [(ngModel)]="user.email" id="lb_email" class="w-full border border-gray-300 rounded-md p-2" />
      </div>
      <div class="mb-4">
        <label for="lb_password" class="text-white">Mot de passe <i class="text-red-300">*</i></label><br />
        <input type="password" [(ngModel)]="user.password" id="lb_password" class="w-full border border-gray-300 rounded-md p-2" />
      </div>
      <div class="mb-4">
        <label for="lb_firstname" class="text-white">Prénom <i class="text-red-300">*</i></label><br />
        <input type="text" [(ngModel)]="user.first_name" id="lb_firstname" class="w-full border border-gray-300 rounded-md p-2" />
      </div>
      <div class="mb-4">
        <label for="lb_lastname" class="text-white">Nom <i class="text-red-300">*</i></label><br />
        <input type="text" [(ngModel)]="user.last_name" id="lb_lastname" class="w-full border border-gray-300 rounded-md p-2" />
      </div>
      <div class="mb-4">
        <label for="lb_birthday" class="text-white">Date d'anniversaire <i class="text-red-300">*</i></label><br />
        <input type="date" [(ngModel)]="user.birth_date" id="lb_birthday" class="w-full border border-gray-300 rounded-md p-2" />
      </div>
      <div class="mb-4">
        <label for="lb_country" class="text-white">Pays <i class="text-red-300">*</i></label><br />
        <select (change)="onCountryChange($event)" id="lb_country" class="w-full border border-gray-300 rounded-md p-2">
          <option value="">Sélectionnez un pays</option>
          <option *ngFor="let country of countries" [value]="country.id">
            {{ country.name }}
          </option>
        </select>
      </div>
      <div class="mb-4">
        <label for="lb_language" class="text-white">Langue <i class="text-red-300">*</i></label><br />
        <select [(ngModel)]="user.language_id" id="lb_language" class="w-full border border-gray-300 rounded-md p-2">
          <option *ngFor="let language of languages" [value]="language.id">
            {{ language.name }}
          </option>
        </select>
      </div>
    </div>

    <button
      (click)="clickRegister()"
      class="px-16 py-2 font-medium bg-blue-500 hover:bg-blue-600 rounded-md text-white mt-6"
    >
      S'inscrire
    </button>

    <p class="py-6 text-white">
      Vous avez déjà un compte ?
      <a href="" (click)="href($event)" class="text-cyan-300 underline">Se connecter maintenant</a>
    </p>
  </div>
</div>
