<div class="container mx-auto px-4 py-8">
  <ng-container *ngIf="isLoading">
    <div class="flex justify-center items-center h-64">
      <mat-spinner></mat-spinner>
    </div>
  </ng-container>

  <ng-container *ngIf="!isLoading">
    <button
      *ngIf="destination && !hideBackButton"
      (click)="goBackToList()"
      class="flex items-center mb-5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg"
    >
      <lucide-icon name="ArrowLeft" class="w-5 h-5"></lucide-icon>
    </button>
    <div *ngIf="destination">
      <span class="flex py-3 text-2xl font-semibold">{{ destination.name }}</span>
    </div>

    <!-- Affichage du détail de la destination -->
    <div *ngIf="destination" class="mb-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="relative">
          <div
            *ngIf="destination.isImageLoading"
            class="absolute inset-0 flex items-center justify-center bg-gray-100 bg-opacity-50"
          >
            <div class="animate-spin rounded-full h-12 w-full border-b-2 border-blue-500"></div>
          </div>
          <img [src]="destination.image" class="w-full h-96 object-cover rounded-lg" alt="{{ destination.name }}" />
        </div>
        <app-google-map
          *ngIf="destination?.latitude && destination?.longitude"
          [lat]="destination.latitude"
          [lng]="destination.longitude"
        ></app-google-map>
      </div>
      <div class="w-full">
        <h2 class="text-2xl font-semibold mb-4">Description</h2>
        <!-- Affichage conditionnel pour la description -->
        <ng-container *ngIf="destination.isDescriptionLoading; else descriptionLoaded">
          <!-- Loader pour la description -->
          <div class="space-y-3">
            <div class="h-4 bg-gray-200 rounded w-3/4 animate-pulse"></div>
            <div class="h-4 bg-gray-200 rounded w-full animate-pulse"></div>
            <div class="h-4 bg-gray-200 rounded w-5/6 animate-pulse"></div>
            <div class="h-4 bg-gray-200 rounded w-full animate-pulse"></div>
            <div class="h-4 bg-gray-200 rounded w-2/3 animate-pulse"></div>
          </div>
        </ng-container>

        <!-- Template pour la description chargée -->
        <ng-template #descriptionLoaded>
          <p class="text-gray-600 mt-2 text-sm whitespace-pre-line">
            {{ destination.description }}
          </p>
        </ng-template>
      </div>
    </div>

    <!-- Résultats de recherche (si aucune destination spécifique) avec pagination -->
    <div *ngIf="!destination && paginatedResults.length > 0">
      <!-- Grille de résultats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div *ngFor="let result of paginatedResults" class="border rounded-lg overflow-hidden shadow-md">
          <img
            [src]="result.image"
            class="w-full h-44 object-cover"
            onerror="this.onerror=null; this.src='assets/images/noimages.jpg';"
            loading="lazy"
          />
          <div class="p-4">
            <h3 class="text-xl font-semibold mb-2">{{ result.name }}</h3>
            <p class="text-sm text-gray-500 mb-2">{{ result.type === 'city' ? 'Ville' : 'Pays' }}</p>
            <p class="text-gray-700 mb-4 line-clamp-3">{{ result.description }}</p>
            <button
              (click)="viewDestinationDetails(result)"
              class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-full text-sm"
            >
              Voir plus
            </button>
          </div>
        </div>
      </div>

      <!-- Contrôles de pagination -->
      <div *ngIf="totalPages > 1" class="flex justify-center items-center space-x-2 mt-6">
        <button
          (click)="prevPage()"
          [disabled]="currentPage === 1"
          class="px-4 py-2 rounded-md border border-gray-300"
          [ngClass]="{ 'opacity-50 cursor-not-allowed': currentPage === 1, 'hover:bg-gray-100': currentPage > 1 }"
        >
          <lucide-icon name="ChevronsLeft" class="w-5 h-5"></lucide-icon>
        </button>

        <!-- Affichage des numéros de page -->
        <ng-container *ngFor="let page of [].constructor(totalPages); let i = index">
          <button
            *ngIf="showPageNumber(i + 1)"
            (click)="goToPage(i + 1)"
            class="px-4 py-2 rounded-md"
            [ngClass]="{
              'bg-blue-500 text-white': currentPage === i + 1,
              'border border-gray-300 hover:bg-gray-100': currentPage !== i + 1
            }"
          >
            {{ i + 1 }}
          </button>
        </ng-container>

        <button
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
          class="px-4 py-2 rounded-md border border-gray-300"
          [ngClass]="{
            'opacity-50 cursor-not-allowed': currentPage === totalPages,
            'hover:bg-gray-100': currentPage < totalPages
          }"
        >
          <lucide-icon name="ChevronsRight" class="w-5 h-5"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Message si aucun résultat trouvé -->
    <div *ngIf="!destination && searchResults.length === 0 && searchTerm" class="text-center py-10">
      <lucide-icon name="search-x" class="mx-auto h-16 w-16 text-gray-400 mb-4"></lucide-icon>
      <h2 class="text-2xl font-semibold mb-2">Aucun résultat trouvé</h2>
      <p class="text-gray-600">Nous n'avons pas trouvé de destination pour "{{ searchTerm }}"</p>
    </div>
  </ng-container>
</div>
