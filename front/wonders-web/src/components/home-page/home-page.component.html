<!-- HERO SLIDER IMMERSIF -->
<div class="hero-slider w-full h-screen relative overflow-hidden">
  <div class="hero-slide">
    <img
      [src]="heroImages[currentHeroIndex]"
      alt="Hero image"
      class="w-full h-screen object-cover"
    />
    <div
      class="absolute inset-0 bg-black bg-opacity-50 z-10 flex flex-col items-center justify-center p-6 text-center"
    >
      <h1 class="text-white text-5xl font-bold mb-4">
        {{ 'HomePage.HomeTitle' | translate }}
      </h1>
      <app-search-destination class="w-full max-w-lg z-20"></app-search-destination>
    </div>
  </div>
</div>

<!-- SECTION DESTINATIONS POPULAIRES -->
<div class="max-w-screen-xl mx-auto px-4 py-10">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8">
    <span class="text-2xl md:text-3xl font-semibold text-gray-800">
      {{ 'HomePage.HomeSubTitle' | translate }}
    </span>
    <button (click)="showMore()">
      {{ 'HomePage.HomeShowMore' | translate }}
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let destination of popularDestinations" class="rounded-xl overflow-hidden bg-white shadow-md hover:shadow-xl transition-shadow duration-300">
      <div class="relative w-full aspect-[4/3] bg-gray-100">
        <div *ngIf="destination.loading" class="absolute inset-0 flex items-center justify-center">
          <div class="animate-spin rounded-full h-10 w-10 border-2 border-b-transparent border-orange-500"></div>
        </div>
        <img
          *ngIf="!destination.loading"
          [src]="destination.imageSrc"
          alt="{{ destination.cityName }}"
          class="object-cover w-full h-full"
          (error)="handleImageError($event)"
        />
      </div>
      <div class="p-4">
        <h3 class="font-semibold text-blue-700 text-lg">
          {{ destination.cityName }}, {{ destination.countryName }}
        </h3>
        <p class="text-sm text-gray-600 mt-1">{{ destination.description }}</p>
      </div>
    </div>
  </div>
</div>
