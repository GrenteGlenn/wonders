<div class="login-wrapper">
  <img src="assets/images/hero-home-1.jpg" alt="Fond" class="background-image" />

  <div class="overlay"></div>

  <div class="flex justify-center items-center min-h-screen">
    <div class="container mx-auto px-4">
      <div class="max-w-md mx-auto">
        <div class="glass-card relative z-10 p-6">
          <div class="flex justify-center mb-4">
            <h1 class="text-3xl font-bold text-center mb-8">Connexion</h1>
          </div>

          <form #loginForm="ngForm" (ngSubmit)="clickLogin(loginForm)" novalidate class="space-y-4">
            <div>
              <label for="lb_email" class="block text-sm font-medium text-gray-700 mb-1">Adresse mail</label>
              <input
                type="email"
                id="lb_email"
                name="email"
                [(ngModel)]="email"
                #emailCtrl="ngModel"
                required
                class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                [ngModelOptions]="{ updateOn: 'blur' }"
              />
              <div
                *ngIf="emailCtrl.invalid && (emailCtrl.touched || emailCtrl.dirty)"
                class="text-red-600 text-sm mt-1"
              >
                <ng-container *ngIf="emailCtrl.errors?.['required']"> L'adresse e-mail est requise. </ng-container>
                <ng-container *ngIf="emailCtrl.errors?.['email']"> </ng-container>
              </div>
            </div>

            <div>
              <label for="lb_password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
              <input
                type="password"
                id="lb_password"
                name="password"
                [(ngModel)]="password"
                #passwordCtrl="ngModel"
                required
                minlength="8"
                class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                [ngModelOptions]="{ updateOn: 'blur' }"
              />
              <div
                *ngIf="passwordCtrl.invalid && (passwordCtrl.touched || passwordCtrl.dirty)"
                class="text-red-600 text-sm mt-1"
              >
                <ng-container *ngIf="passwordCtrl.errors?.['required']"> Le mot de passe est requis. </ng-container>
              </div>
            </div>

            <button
              type="submit"
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition-colors duration-300 disabled:opacity-50"
            >
              Connexion
            </button>
            <div *ngIf="authError" class="text-red-600 text-sm">
              {{ authError }}
            </div>

            <p class="text-center text-gray-600">
              Vous n'avez pas de compte ?
              <a href="" (click)="href($event)" class="text-blue-500 hover:text-blue-600 underline font-medium">
                S'inscrire
              </a>
            </p>

            <div *ngIf="detectPlatform()">
              <div class="login-separator">
                <div class="separator-line"></div>
                <div class="separator-line"></div>
              </div>

              <div class="w-full mt-4">
                <button
                  (click)="goToSafe()"
                  class="safe-button flex items-center justify-center gap-2 w-full bg-blue-500 hover:bg-orange-400 hover:text-black text-white font-semibold py-2 px-4 rounded-lg transition-all duration-300 shadow-md backdrop-blur-md"
                  routerLink="/"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                >
                  <lucide-icon name="lock" class="w-5 h-5"></lucide-icon>
                  <span>Personal Safe</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
