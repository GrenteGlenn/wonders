<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="container mx-auto px-4">
    
    <div class="max-w-md mx-auto">
      <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300">
        <div class="p-6">
          <div class="flex justify-center mb-4">
            <h1 class="text-3xl font-bold text-center mb-8">Connexion</h1>
            <!-- <lucide-icon name="userCircle" class="w-16 h-16 text-blue-500"></lucide-icon> -->
          </div>
          
          <div class="space-y-4">
            <div>
              <label for="lb_email" class="block text-sm font-medium text-gray-700 mb-1">Adresse mail</label>
              <input 
                type="text" 
                [(ngModel)]="email" 
                id="lb_email" 
                class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              >
            </div>

            <div>
              <label for="lb_password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
              <input 
                type="password" 
                [(ngModel)]="password" 
                id="lb_password" 
                class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              >
            </div>

            <button 
              (click)="clickLogin()" 
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition-colors duration-300"
            >
              Connexion
            </button>

            <p class="text-center text-gray-600">
              Vous n'avez pas de compte ? 
              <a 
                href="" 
                (click)="href($event)" 
                class="text-blue-500 hover:text-blue-600 underline font-medium"
              >
              S'inscrire
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
