<div class="grid grid-cols-1 justify-items-center max-w-2xl mx-auto my-10 py-10 border rounded-md shadow-md">
  <h1 class="text-2xl font-medium mb-16">Connection</h1>
  <div class="justify-self-start px-12 w-full">
    <div class="mb-4">
      <label for="lb_email">Email:</label> <br>
      <input type="text" [(ngModel)]="email" id="lb_email" class="w-full border border-gray-300 rounded-md p-2">
    </div>
    <div class="mb-4">
      <label for="lb_password">Password:</label> <br>
      <input type="password" [(ngModel)]="password" id="lb_password" class="w-full border border-gray-300 rounded-md p-2">
    </div>
  </div>
  <button (click)="clickLogin()" class="px-16 py-2 font-medium bg-blue-500 hover:bg-blue-600 rounded-md text-white mt-8">Sign in</button>
  <p class="mt-2">Don't have an account? <a href="" (click)="href($event)" class="text-cyan-500 underline">register now</a></p>
</div>
