<div class="w-7/12 mx-auto py-10">
  <div *ngIf="!selectedCountry" class="text-center mb-8">
    <h1 class="text-3xl font-bold mb-6">Sélectionnez votre destination</h1>
    <div class="relative w-full max-w-md mx-auto">
      <select
        [(ngModel)]="selectedCountry"
        (ngModelChange)="onCountrySelect($event)"
        class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
      >
        <option value="" disabled selected>Choisissez votre destination</option>
        <option *ngFor="let country of countries" [value]="country.name">
          {{ country.name }}
        </option>
      </select>
      
    </div>
  </div>

  <div *ngIf="selectedCountry">
    <h1 class="text-3xl font-bold mb-2">Votre voyage en {{ selectedCountry }}</h1>
    <div class="relative rounded-lg overflow-hidden">
      <!-- Loader pendant le chargement -->
      <div *ngIf="isLoading" class="w-full h-96 bg-gray-200 animate-pulse flex justify-center items-center">
        <span class="text-gray-500">Chargement de l'image...</span>
      </div>

      <!-- Image une fois chargée -->
      <div *ngIf="!isLoading">
        <img
          [src]="countryImage"
          class="w-full h-96 object-cover"
          (error)="countryImage = 'assets/images/default-country.jpg'"
        />
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="text-white text-center justify-center px-8">
            <p class="text-4xl w-full font-bold mb-4">
              Préparez-vous à explorer {{ selectedCountry }}. {{ countryDescription }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Section Activités -->
