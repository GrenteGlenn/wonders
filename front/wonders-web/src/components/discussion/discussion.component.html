<div class="flex h-full flex-col bg-white">
  <div class="sticky top-0 z-10 bg-white/95 backdrop-blur border-b px-3 sm:px-4 py-2">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="h-10 w-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-700 font-semibold">
          {{ getInitials(currentGroup?.name) }}
        </div>
        <div class="min-w-0">
          <div class="truncate font-semibold">
            {{ currentGroup?.name }}
          </div>
          <div class="text-xs text-slate-500">Discussion</div>
        </div>
      </div>
      <button
        class="flex flex-1 justify-end items-end p-2 rounded hover:bg-slate-100"
        aria-label="Retour"
        (click)="backToList()"
      >
        <lucide-icon name="arrow-left" class="w-5 h-5"></lucide-icon>
      </button>
    </div>
  </div>

  <div #messagesContainer class="flex-1 overflow-y-auto px-2 sm:px-4 py-3 bg-slate-50">
    <!-- SQUELETTE pendant chargement -->
    <div *ngIf="isLoading" class="space-y-3 animate-pulse">
      <div class="flex justify-start">
        <div class="max-w-[75%] bg-white border rounded-2xl rounded-bl-md px-3 py-3 shadow-sm">
          <div class="h-3 w-24 bg-slate-200 rounded mb-2"></div>
          <div class="h-3 w-40 bg-slate-200 rounded"></div>
        </div>
      </div>
      <div class="flex justify-end">
        <div class="max-w-[75%] bg-blue-600/80 rounded-2xl rounded-br-md px-3 py-4">
          <div class="h-3 w-28 bg-blue-500/60 rounded mb-2"></div>
          <div class="h-3 w-32 bg-blue-500/60 rounded"></div>
        </div>
      </div>
      <div class="flex justify-start">
        <div class="max-w-[75%] bg-white border rounded-2xl rounded-bl-md px-3 py-3 shadow-sm">
          <div class="h-3 w-36 bg-slate-200 rounded mb-2"></div>
          <div class="h-3 w-28 bg-slate-200 rounded"></div>
        </div>
      </div>
    </div>

    <ng-container *ngIf="!isLoading">
      <ng-container *ngFor="let message of messages; let i = index; trackBy: trackByMessage">
        <div
          *ngIf="i === 0 || !isSameDay(messages[i - 1]?.timestamp, message.timestamp)"
          class="my-3 flex justify-center"
        >
          <span class="text-xs text-slate-600 bg-white border rounded-full px-3 py-1 shadow-sm">
            {{ formatDay(message.timestamp) }}
          </span>
        </div>

        <!-- Message -->
        <div
          class="mb-2 flex"
          [ngClass]="{ 'justify-end': isOwnMessage(message), 'justify-start': !isOwnMessage(message) }"
        >
          <div class="max-w-[80%] sm:max-w-[70%]">
            <div
              class="relative rounded-2xl px-3 py-2 shadow-sm break-words"
              [ngClass]="
                isOwnMessage(message)
                  ? 'bg-[#1A87CC] text-white rounded-br-md'
                  : 'bg-[#FFA500] text-slate-900 border rounded-bl-md'
              "
            >
              <div *ngIf="!isOwnMessage(message)" class="flex items-center gap-2 mb-1">
                <span class="text-xs font-semibold text-slate-700 truncate">{{ message.username }}</span>
              </div>
              <div class="whitespace-pre-line leading-relaxed">{{ message.text }}</div>
              <div class="mt-1 text-[10px] opacity-70 text-right">
                {{ formatTime(message.timestamp) }}
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Empty state -->
      <div *ngIf="messages.length === 0" class="h-[60vh] flex flex-col items-center justify-center text-slate-500">
        <lucide-icon name="message-square" class="w-10 h-10 mb-2"></lucide-icon>
        <p class="text-sm">Aucun message pour le moment</p>
        <p class="text-xs">Soyez le premier à démarrer la conversation !</p>
      </div>
    </ng-container>
  </div>

  <div class="sticky bottom-0 z-10 bg-white/95 backdrop-blur border-t px-2 sm:px-3 py-2">
    <div
      class="flex w-full items-center gap-2 rounded-full border border-slate-300 bg-white px-2 py-1 focus-within:ring-2 focus-within:ring-blue-500"
    >
      <textarea
        [(ngModel)]="newMessage"
        (keydown.enter)="onEnter($event)"
        (input)="autoGrow($event)"
        rows="1"
        [disabled]="isLoading || isSending"
        [placeholder]="isLoading ? 'Chargement de la discussion…' : 'Tapez votre message…'"
        class="block w-full resize-none bg-transparent px-2 py-1 leading-[1.4] min-h-[40px] max-h-28 outline-none disabled:cursor-not-allowed disabled:text-slate-400"
      ></textarea>

      <button
        (click)="sendMessage()"
        [disabled]="isLoading || !newMessage.trim() || isSending"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-[#FFC46A] text-white hover:brightness-95 disabled:opacity-50"
        aria-label="Envoyer"
      >
        <lucide-icon name="send" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
  </div>
</div>
