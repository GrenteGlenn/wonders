<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="container mx-auto px-4">
    <h1 class="text-3xl font-bold text-center mb-8">Choisissez votre expérience de voyage</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
      <div
        class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300 cursor-pointer cardTransition"
        (click)="router.navigate(['/question'])"
      >
        <div class="p-6">
          <div class="flex justify-center mb-4">
            <lucide-icon name="CircleHelp" class="w-16 h-16 text-blue-500"></lucide-icon>
          </div>
          <h2 class="text-2xl font-semibold text-center mb-4">Guide personnalisé</h2>
          <p class="text-gray-600 text-center">
            Répondez à notre questionnaire pour obtenir un plan de voyage personnalisé en fonction de vos préférences.
          </p>
        </div>
      </div>

      <div
        class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300 cursor-pointer cardTransition"
        (click)="router.navigate(['/stepBody'])"
      >
        <div class="p-6">
          <div class="flex justify-center mb-4">
            <lucide-icon name="map" class="w-16 h-16 text-green-500"></lucide-icon>
          </div>
          <h2 class="text-2xl font-semibold text-center mb-4">Planification directe</h2>
          <p class="text-gray-600 text-center">
            Commencez à planifier votre voyage directement si vous connaissez déjà votre destination
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
