<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-6 max-h-[90vh] w-[896px] flex flex-col">
      <div class="items-end justify-end flex mb-4">
        <!-- <h2 class="text-xl font-semibold">Ajouter une activité à {{cityName}}</h2> -->
        <button (click)="close()" class="text-black hover:text-gray-700 ">
          <lucide-icon name="circle-x" class="w-6 h-6"></lucide-icon>
        </button>
      </div>

     <!-- Stepper -->
      <div class="mb-6">
        <div class="flex items-center justify-between relative">
          <div *ngFor="let step of steps; let i = index" 
              class="flex flex-col items-center flex-1">
            <div [class]="'w-8 h-8 rounded-full flex items-center justify-center ' + 
                        (currentStep >= i ? 'bg-blue-500 text-white' : 'bg-gray-200')">
              {{i + 1}}
            </div>
            <span class="text-xs mt-1">{{step}}</span>
            <!-- Ligne de connexion simple -->
            <div *ngIf="i < steps.length - 1" 
                [class]="'absolute h-[2px] top-4 -z-10 ' + 
                        (currentStep > i ? 'bg-black' : 'bg-black')"
                [style.left]="(100 * i / (steps.length - 1) + 12) + '%'"
                [style.width]="(100 / (steps.length - 1) - 24) + '%'">
            </div>
          </div>
        </div>
      </div>
      <!-- Step 1: Sélection de la catégorie -->
      <div class="flex-1 min-h-0">
        <div *ngIf="currentStep === 0" class="mb-6">
          <span class="text-md font-medium py-6 flex justify-center">Choisissez une catégorie</span>
          <div class="grid grid-cols-2 gap-4">
              <div *ngFor="let category of categories"
                  (click)="selectCategory(category)"
                  [class]="'p-4 border rounded-lg cursor-pointer transition-all ' + 
                          (selectedCategory?.id === category.id ? 'border-blue-500 bg-blue-50' : 'hover:border-gray-400')">
                  <div class="flex flex-col items-center">
                      <!-- <img [src]="selectCategory(category.picture_id)" 
                              class="w-16 h-16 object-cover rounded-lg mb-2"
                              > -->

                      <span>{{category.name}}</span>
                  </div>
              </div>
          </div>
        </div>

      <!-- Step 2: Choix de la ville -->
        <div *ngIf="currentStep === 1" class="h-full">
          <span class="text-md font-medium py-6 flex justify-center">Villes suggérées pour {{selectedCategory?.name}}</span>
          
          <!-- Loader -->
          <div *ngIf="isLoadingCities" class="flex justify-center items-center h-48">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
          </div>

          <!-- Liste des villes -->
          <div *ngIf="!isLoadingCities" class="grid grid-cols-2 gap-4 overflow-y-auto max-h-[50vh]">
            <div *ngFor="let city of suggestedCities"
                 (click)="selectCity(city)"
                 class="w-full h-36 border rounded-lg cursor-pointer transition-all"
                 [class.border-blue-500]="selectedCity?.city === city.city"
                 [class.bg-blue-50]="selectedCity?.city === city.city"
                 [class.hover:border-blue-500]="selectedCity?.city !== city.city"
                 [class.hover:bg-blue-50]="selectedCity?.city !== city.city">
              <div class="flex flex-col items-center relative h-full">
                <img *ngIf="city.img_full" 
                     [src]="city.img_full" 
                     class="w-full h-36 object-cover rounded-lg">
                <div class="absolute inset-0 bg-black bg-opacity-30 rounded-lg flex items-center justify-center">
                  <span class="text-white text-xl font-bold">{{city.city}}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

     <!-- Step 3: Résumé -->
      <div *ngIf="currentStep === 2" class="mb-6">
        <h3 class="text-lg font-medium mb-4">Résumé de votre activité</h3>
        <div class="bg-gray-50 rounded-lg p-6">
          <div class="space-y-4">
            <!-- Pays -->
            <div class="flex items-center">
              <span class="font-medium w-32">Pays:</span>
              <span>{{cityName}}</span>
            </div>
            
            <!-- Activité -->
            <div class="flex items-center">
              <span class="font-medium w-32">Activité:</span>
              <span>{{selectedCategory?.name}}</span>
            </div>
            
            <!-- Ville sélectionnée -->
            <div class="flex items-start">
              <span class="font-medium w-32">Ville:</span>
              <div class="flex-1">
                <div class="relative w-48 h-36 rounded-lg overflow-hidden">
                  <img [src]="selectedCity?.img_full" 
                      class="w-full h-full object-cover">
                  <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center">
                    <span class="text-white font-bold">{{selectedCity?.city}}</span>
                  </div>
                </div>
                <!-- Description de la ville -->
                <div class="mt-4 text-sm text-gray-600">
                  <p>{{selectedCity?.description}}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation buttons -->
      <div class="flex justify-between mt-6">
        <button *ngIf="currentStep > 0"
                (click)="previousStep()"
                class="px-4 py-2 text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">
          Précédent
        </button>
        <div class="flex-1"></div>
        <button *ngIf="currentStep < steps.length - 1"
                [disabled]="!canProceed"
                (click)="nextStep()"
                class="px-4 py-2 text-white bg-blue-500 rounded-md hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed">
          Suivant
        </button>
        <button *ngIf="currentStep === steps.length - 1"
                (click)="onSubmit()"
                class="px-4 py-2 text-white bg-green-500 rounded-md hover:bg-green-600">
          Terminer
        </button>
      </div>
    </div>
</div>
