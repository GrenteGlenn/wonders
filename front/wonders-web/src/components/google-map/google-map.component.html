<div class="w-full max-w-full h-[385px] md:h-[385px] lg:h-[385px]  overflow-hidden">
	<google-map
	  class="w-full h-full"
	  [options]="options"
	>
	  <!-- Markers brésiliens -->
	  <map-advanced-marker
		*ngFor="let location of displayedMarkers; let i = index"
		#markerElem="mapAdvancedMarker"
		[position]="{ lat: location.lat, lng: location.lng }"
		[content]="location.content"
		(gmpClick)="onMarkerClick(markerElem)">
	  </map-advanced-marker>
  
	  <!-- Markers canadiens -->
	  <map-advanced-marker
		*ngFor="let location of displayedMarkers; let i = index"
		#markerElem="mapAdvancedMarker"
		[position]="{ lat: location.lat, lng: location.lng }"
		[content]="location.content"
		[title]="'Canada Location ' + (i + 1)"
		(mapClick)="onMarkerClick(markerElem)">
	  </map-advanced-marker>
  
	  <map-info-window #infoWindow></map-info-window>
	</google-map>
  </div>
