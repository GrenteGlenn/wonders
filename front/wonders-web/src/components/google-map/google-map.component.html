<div class="w-full max-w-full h-[385px] md:h-[385px] lg:h-[385px] overflow-hidden">
  <ng-container *ngIf="mapsReady; else loading">
    <google-map class="w-full h-full" [options]="options">
      <map-advanced-marker
        *ngFor="let m of displayedMarkers; let i = index"
        #markerElem="mapAdvancedMarker"
        [position]="{ lat: m.lat, lng: m.lng }"
        >
      </map-advanced-marker>

      <map-info-window #infoWindow></map-info-window>
    </google-map>
  </ng-container>

  <ng-template #loading>
    <div class="w-full h-full bg-gray-100"></div>
  </ng-template>
</div>
