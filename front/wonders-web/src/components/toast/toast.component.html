<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-md">
  @for (toast of toasts; track toast.id) {
    <div
      [@fadeAnimation]
      class="p-4 rounded shadow-lg flex items-center gap-3"
      [ngClass]="{
        'bg-green-100 border-l-4 border-green-500 text-green-800': toast.type === 'success',
        'bg-red-100 border-l-4 border-red-500 text-red-800': toast.type === 'error',
        'bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800': toast.type === 'warning'
      }"
    >
      <div class="">
        @if (toast.type === 'success') {
          <lucide-icon name="circle-check-big" class="w-5 h-5"></lucide-icon>
        } @else if (toast.type === 'error') {
          <lucide-icon name="circle-x" class="w-5 h-5"></lucide-icon>
        } @else if (toast.type === 'warning') {
          <lucide-icon name="triangle-alert" class="w-5 h-5"></lucide-icon>
        }
      </div>
      <p class="text-sm pt-2">{{ toast.message }}</p>
      <button (click)="dismissToast(toast.id)" class="ml-auto text-gray-500 hover:text-gray-800">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  }
</div>
