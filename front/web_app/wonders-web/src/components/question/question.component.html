<div class="w-8/12 mx-auto py-10" *ngIf="!showResults">
    <span>Question {{currentQuestionIndex + 1}}/{{questions.length}}</span>
    <div class="progressBar">
      <mat-progress-bar class="custom-progress-bar" mode="determinate" [color]="'primary'" [value]="percent" style="margin-top: 1em;"></mat-progress-bar>
    </div>
    <h1 class="flex w-full mt-6 items-center justify-center  text-sm !important">{{questions[currentQuestionIndex].title}}</h1>

    <div *ngFor="let option of questions[currentQuestionIndex].options; let i = index" class="w-full flex py-4 px-6 rounded-md border mt-5">
        <input [id]="'radio-' + i" 
               type="radio" 
               [value]="option" 
               name="question-option" 
               [(ngModel)]="selectedAnswers[currentQuestionIndex]"
               class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
        <label [for]="'radio-' + i" class="ms-2 text-sm font-medium text-gray-900">{{option}}</label>    
      </div>
      <button *ngIf="currentQuestionIndex > 0" class="bg-slate-300 rounded-md py-2 px-5 float-start mt-10" (click)="previousQuestion()">Précédent</button>
      <button *ngIf="currentQuestionIndex < questions.length - 1" 
              [disabled]="!selectedAnswers[currentQuestionIndex]"
              [ngClass]="{'bg-blue-500 text-white': selectedAnswers[currentQuestionIndex], 'bg-gray-300 text-gray-500': !selectedAnswers[currentQuestionIndex]}"
              class="rounded-md py-2 px-5 float-end mt-10" 
              (click)="nextQuestion()">Next</button>
      <button *ngIf="currentQuestionIndex === questions.length - 1" 
              [disabled]="!selectedAnswers[currentQuestionIndex]"
              [ngClass]="{'bg-green-500 text-white': selectedAnswers[currentQuestionIndex], 'bg-gray-300 text-gray-500': !selectedAnswers[currentQuestionIndex]}"
              class="rounded-md py-2 px-5 float-end mt-10" 
              (click)="showResult()">Terminer</button>
    </div>

  
  <div *ngIf="showResults" class="w-8/12 mx-auto py-10">
    <h1 class="text-3xl font-bold text-center mb-10">Félicitations ! Vous avez terminé le questionnaire</h1>
    <h2 class="text-xl text-center mb-10">Voici les 3 destinations proposées d'après le questionnaire</h2>
    <h2 class="text-xl text-center mb-10">Veuillez en selectionner une</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div *ngFor="let result of results" [ngClass]="['bg-white shadow-lg rounded-lg  cardTransition hover:cursor-pointer', result.class]" (click)="navigateToPlanTrip(result.title)">
        <h2 class="text-xl font-semibold  text-center text-black">{{result.title}}</h2>
      </div>
    </div>
  </div>
